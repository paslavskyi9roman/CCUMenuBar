name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Ensure jq is available
        run: brew list jq || brew install jq
      - name: Build
        run: swift build
      - name: Test
        run: swift test
