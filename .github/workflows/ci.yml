name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # macos-14's default /Applications/Xcode.app symlink resolves to 15.4
        # (Swift 5.10), which predates the Testing framework our tests import.
        # Xcode 16.2 (Swift 6.x) is also preinstalled on this runner image —
        # select it explicitly so swift-tools-version 6.0 is supported.
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Ensure jq is available
        run: brew list jq || brew install jq
      - name: Build
        run: swift build
      - name: Test
        run: swift test
